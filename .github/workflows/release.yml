# Builds the Windows installer (LocalTranscriber-Setup-<version>.exe) on GitHub's
# Windows machines and attaches it to a GitHub Release.
#
# Publish a new version:  bump "version" in package.json, commit, then
#   git tag v1.0.1 && git push origin v1.0.1
# (or run this workflow by hand from the "Actions" tab: it then only uploads the
# installer as a build artifact, without creating a release).
#
# No API key is bundled: the free AI goes through the account server (Ai:Groq:ApiKey there).
name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs the Node packages and, through postinstall, the Python engine
      # (CPU build: GitHub's machines have no NVIDIA GPU, which keeps the installer small).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build interface and engine
        run: npm run build

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Upload installer (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranscriber-Setup
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml tells installed copies about the new version (automatic updates).
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          make_latest: true
